<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftIA - Especialista Nerd</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="gift.png">
</head>

<body>
    <div class="container">

        <img src="gift.png" width="200" alt="GiftIA Logo">
        <h2>Especialista em escolher os</h2>
        <h2>MELHORES PRESENTES! 🎁</h2>
        <p> Responda e descubra qual o presente perfeito para você.</p>

        <form action="processa.php" method="POST">
            <div class="form-group">
                <label>Pra quem você irá dar o presente? 👨🏻👩🏻</label>
                <select name="genero" required>
                    <option value="">Selecione...</option>
                    <option value="Homem">Homem</option>
                    <option value="Mulher">Mulher</option>
                </select>
            </div>

            <div class="form-group">
                <label>Qual a idade dessa pessoa? 🔞</label>
                <select name="idade" required>
                    <option value="">Selecione...</option>
                    <option value="Bebê">De 1 a 5 anos</option>
                    <option value="Criança">De 5 a 12 anos</option>
                    <option value="Adolescente">De 13 a 18 anos</option>
                    <option value="Jovem">De 19 a 29 anos</option>
                    <option value="Adulto">De 30 anos ou mais</option>
                </select>
            </div>

            <div class="form-group">
                <label>Qual valor você pretende gastar no presente? 💵</label>
                <select name="valor" required>
                    <option value="">Selecione...</option>
                    <option value="pouco">Até R$50,00</option>
                    <option value="medio">De R$50,00 a R$100,00</option>
                    <option value="alto">De R$100,00 a R$200,00</option>
                </select>
            </div>

            <button type="submit">DESCUBRA NOSSA RECOMENDAÇÃO 🎁</button>

        </form>

    </div>

</body>

</html>
